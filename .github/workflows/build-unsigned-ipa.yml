name: Build unsigned tvOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - plezy-external-player-1.0.37
      - plezy-only-no-neptune-1.0.37
      - standalone-native-player-1.0.37

jobs:
  build:
    name: Build Nuvio tvOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: Fetch playback frameworks
        run: |
          chmod +x Scripts/fetch-mpv.sh
          ./Scripts/fetch-mpv.sh

      - name: Verify playback frameworks
        run: |
          test -d Vendor/Libmpv.xcframework
          test -d Vendor/Libavcodec.xcframework
          test -d Vendor/MoltenVK.xcframework
          echo "Vendor frameworks present:"
          find Vendor -maxdepth 1 -name '*.xcframework' -type d | sort

      - name: Verify native-only external player integration
        run: |
          grep -q 'case nuvioNative' Sources/Data/ExternalPlayers.swift
          grep -q 'nuvio-player' project.yml
          if grep -iqE 'case plezy|plezy://' Sources/Data/ExternalPlayers.swift; then
            echo 'Plezy unexpectedly offered as an external player'
            exit 1
          fi
          if grep -iqE 'neptune|plezy' Sources/App/Info.plist; then
            echo 'Old player scheme unexpectedly present in source Info.plist'
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          rm -rf build

          xcodebuild archive \
            -project NuvioTVOS.xcodeproj \
            -scheme NuvioTVOS \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath build/NuvioTVOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/NuvioTVOS.xcarchive/Products/Applications/Nuvio.app"

          test -d "$APP_PATH"
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          schemes = info.get('LSApplicationQueriesSchemes', [])
          assert 'nuvio-player' in schemes, f'No native player query scheme: {schemes!r}'
          assert 'plezy' not in schemes, f'Old Plezy query scheme: {schemes!r}'
          print('Validated packaged Nuvio external schemes:', schemes)
          PY

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qry NuvioTVOS-Native-Only-1.0.37-unsigned.ipa Payload

          test -f NuvioTVOS-Native-Only-1.0.37-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTVOS-Native-Only-unsigned
          path: build/NuvioTVOS-Native-Only-1.0.37-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
